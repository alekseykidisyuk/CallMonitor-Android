name: Build CallMonitor Android

on:
  push:
    branches:
      - "callmonitor/**"
  workflow_dispatch:

concurrency:
  group: callmonitor-android-test-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[signer-backup]') }}
    env:
      CALLMONITOR_BUILD19_CERT_SHA256: d7e12ebca805d06bc32931ee4dcada354c0ef1da36713998015b465e1fa547fc
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout fork with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore original CallMonitor signer from repository secret
        env:
          KEYSTORE_B64: ${{ secrets.CALLMONITOR_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_B64" || { echo "Missing CALLMONITOR_SIGNING_KEYSTORE_B64 repository secret"; exit 1; }
          mkdir -p "$HOME/.android"
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          raw = base64.b64decode(os.environ['KEYSTORE_B64'].strip(), validate=True)
          if not raw or len(raw) > 32768:
              raise SystemExit('Invalid signer keystore size')
          Path.home().joinpath('.android/debug.keystore').write_bytes(raw)
          PYCODE
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/callmonitor-signer.der"
          ACTUAL_CERT=$(sha256sum "$RUNNER_TEMP/callmonitor-signer.der" | cut -d ' ' -f 1)
          test "$ACTUAL_CERT" = "$CALLMONITOR_BUILD19_CERT_SHA256" || { echo "Signer differs from verified build 19"; exit 1; }
          echo "Verified original build 19 signer: $ACTUAL_CERT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify build 19 capture boundaries
        run: python3 .github/scripts/verify_build20_scope.py

      - name: Apply build 16 HyperOS UI recovery patch
        run: python3 .github/scripts/build16_hyperos_ui_recovery_patch.py

      - name: Apply build 17 search-result patch
        run: python3 .github/scripts/build17_search_result_patch.py

      - name: Apply build 18 UI-cleanup patch
        run: python3 .github/scripts/build18_cleanup_ui_patch.py

      - name: Apply build 19 stereo voice-call patch
        run: python3 .github/scripts/build19_stereo_voicecall_patch.py

      - name: Test CallMonitor durable delivery
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.baba.callvault.callmonitor.*' --stacktrace \
            -PversionCode=220020 -PversionName=2.2.0-callmonitor.20 -PciBuildNumber=20

      - name: Upload delivery test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallMonitor-build20-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build test APK
        run: |
          chmod +x ./gradlew
          PRODUCT_BUILD=20
          VERSION_CODE=$((220000 + PRODUCT_BUILD))
          VERSION_NAME="2.2.0-callmonitor.${PRODUCT_BUILD}"
          ./gradlew assembleDebug --stacktrace \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -PciBuildNumber="$PRODUCT_BUILD"

      - name: Re-sign and verify artifact with stable test signer
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          INPUT_APK="app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT_APK="CallMonitor-Android-build20.apk"

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT_APK" \
            "$INPUT_APK"

          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK"

          EXPECTED_CERT="$CALLMONITOR_BUILD19_CERT_SHA256"
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$OUTPUT_APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]')

          echo "Expected test signer: $EXPECTED_CERT"
          echo "APK signer:           $ACTUAL_CERT"
          test -n "$EXPECTED_CERT"
          test "$EXPECTED_CERT" = "$ACTUAL_CERT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallMonitor-Android-build20
          path: CallMonitor-Android-build20.apk
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 update installer
        shell: powershell
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/callmonitor-build20/INSTALL_UPDATE.ps1'),
            [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count -gt 0) { throw ($Errors | Out-String) }
          Write-Host 'PASS: Windows PowerShell 5.1 installer syntax'
